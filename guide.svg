<svg xmlns="http://www.w3.org/2000/svg" width="1394" height="926" viewBox="0 0 1394 926">
  <rect x="1076" y="318" width="285" height="570" fill="#182631"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#c4d3dd">
    <g font-size="19" font-weight="700" fill="#edf3f8">
      <text x="1083" y="350">1. Выбери фишку</text>
      <text x="1083" y="433">2. Иди на круг</text>
      <text x="1083" y="521">3. Встретил врага?</text>
      <text x="1083" y="755">Ведущий</text>
    </g>
    <text x="1083" y="376">Открой «Доминион» слева вверху.</text>
    <text x="1083" y="398">Выбери фишку и её аспект.</text>
    <text x="1083" y="459">Кнопка точки задаёт цель бега.</text>
    <text x="1083" y="481">Захват — 10 с без врагов.</text>
    <text x="1083" y="503">Чужую точку сперва сбей за 10 с.</text>
    <text x="1083" y="547">Панель боя откроется сама.</text>
    <text x="1083" y="569">Жми кнопку действия раз в 3 с.</text>
    <text x="1083" y="591">Два пропуска — поражение.</text>
    <text x="1083" y="613">Можно уйти до конца боя.</text>
    <text x="1083" y="647" font-size="19" font-weight="700" fill="#ffba70">Лапа · баф питомца</text>
    <text x="1083" y="673">Возьми за 5 с без врагов.</text>
    <text x="1083" y="695">Усиливает твой аспект на 20%.</text>
    <text x="1083" y="717">Один заряд на один бой.</text>
    <text x="1083" y="781">Открой «Доминион» → «Начать».</text>
    <text x="1083" y="803">12 минут или до 1000 очков.</text>
    <text x="1083" y="825">После смерти — респ, 25 с.</text>
    <text x="1083" y="847">Первая волна бафов — через 30 с.</text>
    <text x="1083" y="869">Далее — каждые 2 минуты.</text>
  </g>
</svg>
